<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KlemeSaaS | Unified School Platform</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        /* 1. የጀርባውን ምስል ብቻ ለይቶ ማሳነሻ */
        .main-panel img[src*="unsplash"], main img[src*="unsplash"], .content img[src*="unsplash"] {
            height: 180px !important;
            object-fit: cover !important;
            border-radius: 16px !important;
            width: 100% !important;
            margin-bottom: 20px !important;
        }
        /* 2. የካርዶቹን ምስል መጠን ማጥበቢያ */
        .academic-excellence img, [class*="card"] img {
            width: 50px !important;
            height: 50px !important;
            object-fit: cover !important;
            border-radius: 50% !important;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }

        // --- LIVE QUIZ HUB LOGIC ---
        // መምህሩ ያዘጋጀውን ጥያቄ በጊዜያዊነት ለማስቀመጥ
        let currentQuiz = {
            questionText: "What is the derivative of f(x) = 3x^2 + 5?",
            options: { A: "3x", B: "6x", C: "6x + 5", D: "6x^2" },
            correctAnswer: "B"
        };

        // መምህሩ አዲስ ጥያቄ ሲያትም
        function publishNewQuiz() {
            const qText = document.getElementById('teacherQuestion').value;
            const opA = document.getElementById('optA').value;
            const opB = document.getElementById('optB').value;
            const opC = document.getElementById('optC').value;
            const opD = document.getElementById('optD').value;
            const correctAns = document.getElementById('correctAnswerKey').value;

            if(!qText || !opA || !opB || !opC || !opD || correctAns === "Select Correct Answer Key") {
                alert("⚠️ Please fill in all question fields and select the correct answer key!");
                return;
            }

            // መረጃውን ማደስ
            currentQuiz.questionText = qText;
            currentQuiz.options.A = opA;
            currentQuiz.options.B = opB;
            currentQuiz.options.C = opC;
            currentQuiz.options.D = opD;
            currentQuiz.correctAnswer = correctAns;

            // የተማሪውን መፈተኛ በይነገጽ በራስ-ሰር መቀየር
            document.getElementById('studentQuestionDisplay').innerText = qText;
            document.getElementById('lblOptA').innerText = "A) " + opA;
            document.getElementById('lblOptB').innerText = "B) " + opB;
            document.getElementById('lblOptC').innerText = "C) " + opC;
            document.getElementById('lblOptD').innerText = "D) " + opD;

            alert("🚀 Quiz Published Successfully! Student Exam Dashboard has been updated in real-time.");
        }

        // ተማሪው ፈተናውን ሰርቶ ሲያስረክብ
        function submitStudentExam() {
            const selectedRadio = document.querySelector('input[name="live_quiz_opt"]:checked');
            if(!selectedRadio) {
                alert("⚠️ Please select an answer before submitting!");
                return;
            }

            const studentAnswer = selectedRadio.value;
            const resultBox = document.getElementById('examResultPanel');
            const scoreText = document.getElementById('liveScoreDisplay');
            const teacherFeedback = document.getElementById('teacherFeedbackRow');

            if(studentAnswer === currentQuiz.correctAnswer) {
                scoreText.innerHTML = "<span class='text-green-600 font-bold'>Score: 100% (Grade: A)</span><br><p class='text-[11px] text-gray-500 mt-1'>Excellent job! Your response matches the answer key perfectly.</p>";
                // መምህሩ የሚያየው ሰንጠረዥ ላይ ውጤት መጨመር
                teacherFeedback.innerHTML = `<td class='p-3 font-medium'>Aster Tolossa</td><td class='p-3'>Grade 12</td><td class='p-3 text-green-600 font-bold'>100% (Grade: A)</td><td class='p-3'>Online Exam</td><td class='p-3'><span class='px-2 py-0.5 bg-green-100 text-green-700 rounded-md text-[10px] font-bold'>Graded</span></td>`;
            } else {
                scoreText.innerHTML = `<span class='text-red-600 font-bold'>Score: 0% (Grade: F)</span><br><p class='text-[11px] text-gray-500 mt-1'>Incorrect. The correct answer was Option ${currentQuiz.correctAnswer}.</p>`;
                teacherFeedback.innerHTML = `<td class='p-3 font-medium'>Aster Tolossa</td><td class='p-3'>Grade 12</td><td class='p-3 text-red-600 font-bold'>0% (Grade: F)</td><td class='p-3'>Online Exam</td><td class='p-3'><span class='px-2 py-0.5 bg-red-100 text-red-700 rounded-md text-[10px] font-bold'>Failed</span></td>`;
            }

            resultBox.classList.remove('hidden');
            alert("🎯 Exam submitted successfully! Grade compiled and synchronized with the Teacher Panel.");
        }

        // የፋይል አፕሎድ ማስመሰያ
        function triggerFileBrowse() {
            document.getElementById('hiddenFileInput').click();
        }
        function handleFileSelect(input) {
            if(input.files && input.files[0]) {
                alert(`📄 File "${input.files[0].name}" synchronized successfully! Ready for distribution.`);
            }
        }
    </script>
</head>
